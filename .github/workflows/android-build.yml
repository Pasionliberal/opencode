name: Android Build

on:
  push:
    branches: [ claude/led-screen-app-075o8a ]
    paths:
      - 'packages/led-screen-android/**'
  pull_request:
    branches: [ claude/led-screen-app-075o8a ]
    paths:
      - 'packages/led-screen-android/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3

    - name: Make gradlew executable
      working-directory: packages/led-screen-android
      run: chmod +x gradlew || gradle --version

    - name: Build Android App
      working-directory: packages/led-screen-android
      run: gradle clean build -x test

    - name: Build APK
      working-directory: packages/led-screen-android
      run: gradle assembleDebug

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: led-screen-editor-debug.apk
        path: packages/led-screen-android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn
