name: Android Build

on:
  push:
    branches: [ claude/led-screen-app-075o8a ]
    paths:
      - 'packages/led-screen-android/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      working-directory: packages/led-screen-android
      run: |
        gradle --version
        gradle assembleDebug -v
