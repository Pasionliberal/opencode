name: Android Build

on:
  push:
    branches: [ claude/led-screen-app-075o8a ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Debug
      working-directory: packages/led-screen-android
      run: |
        echo "=== Gradle Version ==="
        gradle --version
        echo "=== Project Structure ==="
        ls -la
        echo "=== App Build.gradle ==="
        cat app/build.gradle.kts

    - name: Build
      working-directory: packages/led-screen-android
      run: gradle assembleDebug 2>&1 || true

    - name: Show Errors
      if: failure()
      working-directory: packages/led-screen-android
      run: |
        echo "=== Build Output ==="
        cat build/reports/problems/problems-report.html 2>/dev/null || echo "No problems report"
        find . -name "*.log" -type f -exec cat {} \;
