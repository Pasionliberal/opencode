name: Android Build

on:
  push:
    branches: [ claude/led-screen-app-075o8a ]
    paths:
      - 'packages/led-screen-android/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      working-directory: packages/led-screen-android
      run: gradle assembleDebug --no-daemon

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: led-screen-editor.apk
        path: packages/led-screen-android/app/build/outputs/apk/debug/*.apk
